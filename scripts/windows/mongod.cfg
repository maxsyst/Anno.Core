# MongoDB 8.3 Windows service configuration
# Fixes common Error 1053 causes: invalid YAML, missing paths, Program Files write denials.
# Apply with Fix-MongoDB-Service-1053.ps1 (recommended) or copy over:
#   C:\Program Files\MongoDB\Server\8.3\bin\mongod.cfg
#
# YAML rules: use spaces only (never tabs); keep 2-space indentation.

storage:
  dbPath: C:\data\db

systemLog:
  destination: file
  logAppend: true
  path: C:\data\log\mongod.log

net:
  bindIp: 127.0.0.1,::1
  port: 27017

# Keep security commented until you create an admin user, then enable:
# security:
#   authorization: enabled
